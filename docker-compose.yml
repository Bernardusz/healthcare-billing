services:
  postgres:
    image: postgres:18-trixie
    container_name: healthcare-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-healthcare_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MESSAGE_MODE: ${MESSAGE_MODE:-always}
      LOGGING_MODE: ${LOGGING_MODE}
      AUTH_MODE: ${AUTH_MODE}
      SPRING_DOC_API_DOCS_ENABLED: ${SPRING_DOC_API_DOCS_ENABLED}
      SPRING_DOC_SWAGGER_UI_ENABLED: ${SPRING_DOC_SWAGGER_UI_ENABLED}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare-frontend-build
    volumes:
      - static_content:/public

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: healthcare-proxy
    ports:
      - "80:80"
    volumes:
      - static_content:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_content: