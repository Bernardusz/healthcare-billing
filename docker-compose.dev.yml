services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 512M
    image: postgres:18-alpine
    container_name: healthcare-db-dev
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-healthcare_db}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_dev_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-healthcare_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-dev:
    image: eclipse-temurin:25-jdk
    container_name: healthcare-backend-dev
    working_dir: /app
    ports:
      - "8080:8080"   # Expose WebFlux REST API directly to localhost
      - "5005:5005"   # Optional: Java Remote Debugging port
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MESSAGE_MODE: ${MESSAGE_MODE:-always}
      LOGGING_MODE: ${LOGGING_MODE}
      AUTH_MODE: ${AUTH_MODE}
      SPRING_DOC_API_DOCS_ENABLED: ${SPRING_DOC_API_DOCS_ENABLED}
      SPRING_DOC_SWAGGER_UI_ENABLED: ${SPRING_DOC_SWAGGER_UI_ENABLED}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m"
    volumes:
      # 🚀 BIND MOUNT: Mounts your host backend source directly inside the container
      - ./backend:/app
      # Cache Gradle dependencies on host so restarts are fast
      - ~/.gradle:/root/.gradle
    command: ./gradlew bootRun -t --no-daemon
    depends_on:
      postgres:
        condition: service_healthy

  frontend-dev:
    image: node:24-alpine
    container_name: healthcare-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Point PNPM store to a dedicated cached folder inside the container
      PNPM_HOME: "/root/.local/share/pnpm"
      NODE_OPTIONS: "--max-old-space-size=1024"
    volumes:
      # 1. Bind mount your frontend source code
      - ./frontend:/app
      # 2. Named volume for node_modules (persists across container recreation)
      - frontend_node_modules:/app/node_modules
      # 3. Cache pnpm store on your Debian host filesystem
      - ~/.pnpm-store:/root/.local/share/pnpm/store
    # Boot straight into Vite dev server (skip re-installing on every start)
    command: sh -c "corepack enable && pnpm run dev -- --host"
    depends_on:
      - backend-dev

volumes:
  postgres_dev_data:
  frontend_node_modules: