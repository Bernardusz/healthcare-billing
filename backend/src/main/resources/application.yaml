spring:
  application:
    name: healthcare-billing
  devtools:
    restart:
      enabled: true
      poll-interval: 1000ms
      quiet-period: 700ms

  # R2DBC Reactive Database Configuration
  r2dbc:
    url: r2dbc:postgresql://${DATABASE_HOST:postgres}:5432/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    pool:
      enabled: true
      initial-size: 10
      max-size: 30
      max-idle-time: 30m

  # Automatic Schema Initialization (Development Only)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # Jackson JSON Serialization Settings
  jackson:
    default-property-inclusion: always

# Custom Security & JWT Application Properties
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000        # 15 minutes
  refresh-token-expiration-ms: 604800000    # 7 days

# Server Configuration
server:
  port: 8080
  error:
    include-message: ${MESSAGE_MODE}

# Logging Configuration
logging:
  level:
    root: INFO
    io.github.bernardusz.healthcare_billing: ${LOGGING_MODE:INFO}
    org.springframework.security: ${LOGGING_MODE:INFO}
    org.springframework.web: ${LOGGING_MODE:INFO}
    org.springframework.web.reactive: ${LOGGING_MODE:INFO}
    org.springframework.r2dbc: ${LOGGING_MODE:INFO}
    io.r2dbc.postgresql: ${LOGGING_MODE:INFO}
springdoc:
  api-docs:
    enabled: ${SPRING_DOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRING_DOC_SWAGGER_UI_ENABLED:true}

app:
  bootstrap:
    admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD}