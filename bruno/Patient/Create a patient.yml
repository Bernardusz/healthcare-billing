info:
  name: Create a patient
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/patients
  body:
    type: json
    data: |-
      {
        "patientNumber": "PAT-10001",
        "firstName": "Stanislaus",
        "lastName": "Christian",
        "dateOfBirth": "2010-06-16",
        "insuranceProvider": "MyProvider",
        "policyNumber": "POL-88291029"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
