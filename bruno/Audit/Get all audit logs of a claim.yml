info:
  name: "Get all audit logs of a claim "
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/api/v1/audit/claims/:claimId/logs
  params:
    - name: claimId
      value: "3"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
