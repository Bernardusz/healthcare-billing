info:
  name: Audit a flagged claim
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/v1/audit/claims/:claimId/resolution
  params:
    - name: claimId
      value: "3"
      type: path
  body:
    type: json
    data: |-
      {
        "claimId": 3,
        "action": "REJECT",
        "notes": "-",
        "flaggedReason": "Duplicate"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
