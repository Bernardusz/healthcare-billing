info:
  name: Create a claim
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/claims
  body:
    type: json
    data: |-
      {
        "claimNumber": "CLM-2026-012",
        "patientId": 3,
        "icdCode": "E11.9",
        "cptCode": "99214",
        "amount": 175.50
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
