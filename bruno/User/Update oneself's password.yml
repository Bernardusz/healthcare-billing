info:
  name: Update oneself's password
  type: http
  seq: 6

http:
  method: PUT
  url: http://localhost:8080/api/v1/users/password
  body:
    type: json
    data: |-
      {
        "newPassword": "Bernardus'password",
        "currentPassword": "Bernardus"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
